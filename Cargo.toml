[workspace]
resolver = "2"
members = [
    "crates/gcode-protocol",
    "crates/gcode-models",
    "crates/gcode-tools",
    "crates/gcode-core",
    "crates/gcode-tui",
    "crates/gcode-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.16", features = ["v4", "serde"] }

gcode-protocol = { path = "crates/gcode-protocol" }
gcode-models = { path = "crates/gcode-models" }
gcode-tools = { path = "crates/gcode-tools" }
gcode-core = { path = "crates/gcode-core" }
gcode-tui = { path = "crates/gcode-tui" }
